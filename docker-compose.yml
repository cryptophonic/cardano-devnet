networks:
  hydranet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.0.0/24
          gateway: 172.16.0.1

services:
  #shell:
    #image: cardanosolutions/cardano-node-ogmios:latest
    #user: $MY_UID:$MY_GID
    #entrypoint: /bin/bash
    #stdin_open: true
    #tty: true
    #volumes:
      #- ${DEVNET_ROOT}/runtime:/runtime
      #- ${CARDANO_ASSETS_PATH}:/assets

  cardano-cli:
    image: ${DEVNET_IMAGE:-ghcr.io/cryptophonic/cardano-node-ogmios:v7.0.0_11.1.2-custom-cb30ce58}
    # x86-64 image (custom cardano-node build); on arm64 hosts this runs under emulation
    platform: linux/amd64
    user: $MY_UID:$MY_GID
    entrypoint: /usr/local/bin/cardano-cli
    volumes:
      - ${PWD}:/work
      - ${DEVNET_ROOT}/runtime:/runtime
      # scripts/cardano-cli sets ISOLATED_IPC to the directory of a host-side
      # CARDANO_NODE_SOCKET_PATH outside runtime/ipc, so the cli talks to that
      # node instead of the devnet's. Set CARDANO_NODE_NETWORK_ID to match that
      # node's network (preview-derived chains are magic 2, not 42).
      - ${ISOLATED_IPC:-${DEVNET_ROOT}/runtime/ipc}:/runtime/ipc
      - ${CARDANO_ASSETS_PATH}:/assets
    working_dir: /work
    environment:
      - CARDANO_NODE_SOCKET_PATH=/runtime/ipc/node.socket
      - CARDANO_NODE_NETWORK_ID=${CARDANO_NODE_NETWORK_ID:-42}

  cardano-node:
    image: ${DEVNET_IMAGE:-ghcr.io/cryptophonic/cardano-node-ogmios:v7.0.0_11.1.2-custom-cb30ce58}
    # x86-64 image (custom cardano-node build); on arm64 hosts this runs under emulation
    platform: linux/amd64
    container_name: devnet-cardano-node
    user: $MY_UID:$MY_GID
    entrypoint: /usr/local/bin/cardano-node
    environment:
      - CARDANO_BLOCK_PRODUCER=true
      - CARDANO_NODE_NETWORK_ID=42
    # override health check because we're not running ogmios here
    healthcheck:
      test: echo "healthy"
      interval: 1m
    command: [
      "run",
      "--config", "/runtime/chain/cardano-node.json",
      "--topology", "/runtime/chain/topology.json",
      "--database-path", "/runtime/data",
      "--socket-path", "/runtime/ipc/node.socket",
      "--shelley-operational-certificate", "/runtime/chain/opcert.cert",
      "--shelley-kes-key", "/runtime/chain/kes.skey",
      "--shelley-vrf-key", "/runtime/chain/vrf.skey"
    ]
    volumes:
      - ${DEVNET_ROOT}/runtime:/runtime
    ports:
      - 12798:12798
    restart: on-failure

  # Isolated fork-mode node: no network namespace at all, so it can neither
  # reach nor be reached by any other node. The Unix socket in /ipc is the only
  # way in or out; clients (cardano-cli, indexer) mount the same directory.
  # Gated behind the "isolated" profile so ordinary compose commands ignore it.
  # Started via scripts/isolated-node, which sets ISOLATED_RUN_DIR to a run
  # directory containing chain/, db/ and ipc/.
  cardano-node-isolated:
    profiles: ["isolated"]
    image: ${DEVNET_IMAGE:-ghcr.io/cryptophonic/cardano-node-ogmios:v7.0.0_11.1.2-custom-cb30ce58}
    # x86-64 image (custom cardano-node build); on arm64 hosts this runs under emulation
    platform: linux/amd64
    container_name: devnet-node-isolated
    user: $MY_UID:$MY_GID
    entrypoint: /usr/local/bin/cardano-node
    network_mode: none
    # Fork gates come from an env file, defaulting to an empty one so a plain
    # run has them unset (that inertness is what phase 1 proves).
    # scripts/isolated-node points ISOLATED_ENV_FILE at <run dir>/chain/fork.env
    # when that file exists.
    env_file: ${ISOLATED_ENV_FILE:-/dev/null}
    # the image healthcheck probes ogmios, which is not running here
    healthcheck:
      test: ["CMD-SHELL", "test -S /ipc/node.socket"]
      interval: 30s
    command: [
      "run",
      "--config", "/rundir/chain/config.json",
      "--topology", "/rundir/chain/topology.json",
      "--database-path", "/rundir/db",
      "--socket-path", "/ipc/node.socket",
      "--host-addr", "127.0.0.1",
      "--port", "3001",
      "--shelley-kes-key", "/rundir/chain/kes.skey",
      "--shelley-vrf-key", "/rundir/chain/vrf.skey",
      "--shelley-operational-certificate", "/rundir/chain/node.opcert"
    ]
    volumes:
      - ${ISOLATED_RUN_DIR:-/var/empty}:/rundir
      - ${ISOLATED_RUN_DIR:-/var/empty}/ipc:/ipc

  ogmios:
    image: ${DEVNET_IMAGE:-ghcr.io/cryptophonic/cardano-node-ogmios:v7.0.0_11.1.2-custom-cb30ce58}
    # x86-64 image (custom cardano-node build); on arm64 hosts this runs under emulation
    platform: linux/amd64
    container_name: devnet-ogmios
    user: $MY_UID:$MY_GID
    entrypoint: /bin/ogmios
    restart: on-failure
    command: [
      "--host", "0.0.0.0",
      "--node-socket", "/runtime/ipc/node.socket",
      "--node-config", "/runtime/chain/cardano-node.json"
    ]
    volumes:
      - ${DEVNET_ROOT}/runtime:/runtime
    ports:
      - ${OGMIOS_PORT:-1337}:1337

  hydra-node:
    image: ghcr.io/cardano-scaling/hydra-node:latest
    user: $MY_UID:$MY_GID
    volumes:
      - ${PWD}:/work
      - ${DEVNET_ROOT}/runtime:/runtime
      - ${DEVNET_ROOT}/hydra:/hydra
      - ${CARDANO_CLI_GURU}/assets:/assets
    networks:
      hydranet:
        ipv4_address: ${HYDRA_IP}
    working_dir: /work
    environment:
      - CARDANO_NODE_SOCKET_PATH=/runtime/ipc/node.socket
      - CARDANO_NODE_NETWORK_ID=42

  hydra-tui:
    image: ghcr.io/cardano-scaling/hydra-tui:latest
    user: $MY_UID:$MY_GID
    stdin_open: true
    tty: true
    volumes:
      - ${PWD}:/work
      - ${DEVNET_ROOT}/runtime:/runtime
      - ${DEVNET_ROOT}/hydra:/hydra
      - ${CARDANO_ASSETS_PATH}:/assets
    networks:
      - hydranet
    working_dir: /work
    environment:
      - CARDANO_NODE_SOCKET_PATH=/runtime/ipc/node.socket
      - CARDANO_NODE_NETWORK_ID=42

