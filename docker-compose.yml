networks:
  # Shared bridge for fork sidecars (ogmios, and later the provider/explorer).
  # External on purpose: each fork runs in its own compose project, so a network
  # declared here would be created once per project -- one bridge per fork,
  # which is exactly what a shared entry point must not have. Created on demand
  # by scripts/devnet-fork.
  devnet-forks:
    name: devnet-forks
    external: true

services:
  #shell:
    #image: cardanosolutions/cardano-node-ogmios:latest
    #user: $MY_UID:$MY_GID
    #entrypoint: /bin/bash
    #stdin_open: true
    #tty: true
    #volumes:
      #- ${DEVNET_ROOT}/runtime:/runtime
      #- ${CARDANO_ASSETS_PATH}:/assets

  cardano-cli:
    image: ${DEVNET_IMAGE:-ghcr.io/cryptophonic/cardano-node-ogmios:v7.0.0_11.1.3-forkmode-d462a8ea9}
    # x86-64 image (custom cardano-node build); on arm64 hosts this runs under emulation
    platform: linux/amd64
    user: $MY_UID:$MY_GID
    entrypoint: /usr/local/bin/cardano-cli
    volumes:
      - ${PWD}:/work
      - ${DEVNET_ROOT}/runtime:/runtime
      # scripts/cardano-cli sets ISOLATED_IPC to the directory of a host-side
      # CARDANO_NODE_SOCKET_PATH outside runtime/ipc, so the cli talks to that
      # node instead of the devnet's. Set CARDANO_NODE_NETWORK_ID to match that
      # node's network (preview-derived chains are magic 2, not 42).
      - ${ISOLATED_IPC:-${DEVNET_ROOT}/runtime/ipc}:/runtime/ipc
      - ${CARDANO_ASSETS_PATH}:/assets
    working_dir: /work
    environment:
      - CARDANO_NODE_SOCKET_PATH=/runtime/ipc/node.socket
      - CARDANO_NODE_NETWORK_ID=${CARDANO_NODE_NETWORK_ID:-42}

  cardano-node:
    image: ${DEVNET_IMAGE:-ghcr.io/cryptophonic/cardano-node-ogmios:v7.0.0_11.1.3-forkmode-d462a8ea9}
    # x86-64 image (custom cardano-node build); on arm64 hosts this runs under emulation
    platform: linux/amd64
    container_name: devnet-cardano-node
    user: $MY_UID:$MY_GID
    entrypoint: /usr/local/bin/cardano-node
    environment:
      - CARDANO_BLOCK_PRODUCER=true
      - CARDANO_NODE_NETWORK_ID=42
    # override health check because we're not running ogmios here
    healthcheck:
      test: echo "healthy"
      interval: 1m
    command: [
      "run",
      "--config", "/runtime/chain/cardano-node.json",
      "--topology", "/runtime/chain/topology.json",
      "--database-path", "/runtime/data",
      "--socket-path", "/runtime/ipc/node.socket",
      "--shelley-operational-certificate", "/runtime/chain/opcert.cert",
      "--shelley-kes-key", "/runtime/chain/kes.skey",
      "--shelley-vrf-key", "/runtime/chain/vrf.skey"
    ]
    volumes:
      - ${DEVNET_ROOT}/runtime:/runtime
    ports:
      - 12798:12798
    restart: on-failure

  # Isolated fork-mode node: no network namespace at all, so it can neither
  # reach nor be reached by any other node. The Unix socket in /ipc is the only
  # way in or out; clients (cardano-cli, indexer) mount the same directory.
  # Gated behind the "isolated" profile so ordinary compose commands ignore it.
  # Started via scripts/isolated-node, which sets ISOLATED_RUN_DIR to a run
  # directory containing chain/, db/ and ipc/.
  cardano-node-isolated:
    profiles: ["isolated"]
    image: ${DEVNET_IMAGE:-ghcr.io/cryptophonic/cardano-node-ogmios:v7.0.0_11.1.3-forkmode-d462a8ea9}
    # x86-64 image (custom cardano-node build); on arm64 hosts this runs under emulation
    platform: linux/amd64
    # One fork per container, named after its run directory, so several forks can
    # run at once. scripts/isolated-node derives the name and also uses a distinct
    # compose project per fork so compose does not reconcile them with each other.
    container_name: ${ISOLATED_CONTAINER_NAME:-devnet-node-isolated}
    # Discovery is by label, not by name pattern: tooling asks docker which forks
    # are running rather than guessing from strings.
    labels:
      devnet.run: producer
      devnet.run.dir: ${ISOLATED_RUN_DIR:-}
    user: $MY_UID:$MY_GID
    entrypoint: /usr/local/bin/cardano-node
    network_mode: none
    # Fork gates and (optionally) a faked clock come from env files, each
    # defaulting to an empty one so a plain run has them unset (that
    # inertness is what phase 1 proves). scripts/isolated-node points
    # ISOLATED_ENV_FILE at <run dir>/chain/fork.env when that file exists, and
    # ISOLATED_FAKETIME_ENV_FILE at <run dir>/chain/faketime.env (written by
    # scripts/set-faketime) when that one does.
    env_file:
      - ${ISOLATED_ENV_FILE:-/dev/null}
      - ${ISOLATED_FAKETIME_ENV_FILE:-/dev/null}
    # LD_PRELOAD and FAKETIME come ONLY from faketime.env above (when
    # present) -- deliberately not set here too, since compose's
    # `environment:` overrides `env_file:` for the same key and an empty
    # default here would silently blank out whatever faketime.env set.
    # FAKETIME_DONT_FAKE_MONOTONIC has to live here rather than in
    # faketime.env, because compose's `environment:` overrides `env_file:` and
    # a value set only in the file would be shadowed by this one. It is a no-op
    # unless libfaketime is actually loaded. scripts/isolated-node exports
    # ISOLATED_DONT_FAKE_MONOTONIC from the run's faketime.env so the run dir
    # stays the single record of the clock settings; the default is 1
    # (CLOCK_MONOTONIC left alone), which is what an unaccelerated shift wants.
    environment:
      - FAKETIME_DONT_FAKE_MONOTONIC=${ISOLATED_DONT_FAKE_MONOTONIC:-1}
    # the image healthcheck probes ogmios, which is not running here
    healthcheck:
      test: ["CMD-SHELL", "test -S /ipc/node.socket"]
      interval: 30s
    command: [
      "run",
      "--config", "/rundir/chain/config.json",
      "--topology", "/rundir/chain/topology.json",
      "--database-path", "/rundir/db",
      "--socket-path", "/ipc/node.socket",
      "--host-addr", "127.0.0.1",
      "--port", "3001",
      "--shelley-kes-key", "/rundir/chain/kes.skey",
      "--shelley-vrf-key", "/rundir/chain/vrf.skey",
      "--shelley-operational-certificate", "/rundir/chain/node.opcert"
    ]
    volumes:
      - ${ISOLATED_RUN_DIR:-/var/empty}:/rundir
      - ${ISOLATED_RUN_DIR:-/var/empty}/ipc:/ipc

  # Per-fork ogmios sidecar. Reaches its fork over the Unix socket in
  # <run dir>/ipc -- NOT over the node's network namespace, which is `none` and
  # stays that way (phase-8 isolation is untouched however many forks run).
  # It publishes no host port; it joins the shared devnet-forks bridge and is
  # addressed by container name there, so one entry point can serve many forks.
  # Started via scripts/devnet-fork ogmios, which sets ISOLATED_RUN_DIR and
  # FORK_OGMIOS_NAME the same way scripts/isolated-node sets the node's.
  ogmios-fork:
    profiles: ["fork-sidecar"]
    image: ${DEVNET_IMAGE:-ghcr.io/cryptophonic/cardano-node-ogmios:v7.0.0_11.1.3-forkmode-d462a8ea9}
    # x86-64 image (custom cardano-node build); on arm64 hosts this runs under emulation
    platform: linux/amd64
    container_name: ${FORK_OGMIOS_NAME:-devnet-fork-ogmios}
    # Discovery is by label, as with the producer: tooling asks docker which
    # sidecars are up rather than guessing from names.
    labels:
      devnet.run: ogmios
      devnet.run.dir: ${ISOLATED_RUN_DIR:-}
    user: $MY_UID:$MY_GID
    entrypoint: /bin/ogmios
    restart: on-failure
    networks:
      - devnet-forks
    command: [
      "--host", "0.0.0.0",
      "--node-socket", "/ipc/node.socket",
      "--node-config", "/rundir/chain/config.json",
      # `devnet fork replay`'s --source ogmios:<url> needs a transaction's raw
      # CBOR to strip and re-witness it; ogmios omits it unless asked.
      "--include-transaction-cbor"
    ]
    volumes:
      - ${ISOLATED_RUN_DIR:-/var/empty}:/rundir
      - ${ISOLATED_RUN_DIR:-/var/empty}/ipc:/ipc

  ogmios:
    image: ${DEVNET_IMAGE:-ghcr.io/cryptophonic/cardano-node-ogmios:v7.0.0_11.1.3-forkmode-d462a8ea9}
    # x86-64 image (custom cardano-node build); on arm64 hosts this runs under emulation
    platform: linux/amd64
    container_name: devnet-ogmios
    user: $MY_UID:$MY_GID
    entrypoint: /bin/ogmios
    restart: on-failure
    command: [
      "--host", "0.0.0.0",
      "--node-socket", "/runtime/ipc/node.socket",
      "--node-config", "/runtime/chain/cardano-node.json"
    ]
    volumes:
      - ${DEVNET_ROOT}/runtime:/runtime
    ports:
      - ${OGMIOS_PORT:-1337}:1337


